<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>スマホ・PC 並べて比較｜エイチクリニック新宿（デモ）</title>
<style>
:root{--ink:#4a3326;--o:#c65a1e;--cream:#f7f1ea;--line:#e3d6c8}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#ece4da;color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);font-size:13px}
.bar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.04em}
.bar select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);max-width:260px}
.bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.bar .sp{flex:1}
.bar a{color:var(--o);font-weight:700;text-decoration:none}
.stage{flex:1;display:flex;gap:20px;padding:16px 20px 20px;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0}
.pane p{margin:0 0 8px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:12px}
.pane p a{color:var(--o);text-decoration:none;font-weight:400}
.sp-p{flex:none;width:392px}
.pc-p{flex:1;min-width:0}
.frame{flex:1;min-height:0;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(74,51,38,.12);overflow:hidden;position:relative}
.sp-p .frame{border-radius:2px}
.frame iframe{border:0;display:block;background:var(--cream)}
.sp-p iframe{width:390px;height:100%}
.pc-p iframe{position:absolute;left:0;top:0;width:1440px;transform-origin:0 0}
@media (max-width:900px){.stage{flex-direction:column}.sp-p{width:100%;height:70vh}.sp-p iframe{width:100%}.pc-p{height:60vh;flex:none}}
</style></head><body>
<div class="bar"><h1>スマホ・PC 並べて比較</h1>
<select id="pg" aria-label="表示するページ"><option value="/">01 TOP</option><option value="/internal-medicine/">02 内科</option><option value="/urology/">03 泌尿器科</option><option value="/std/">04 性病検査・性感染症</option><option value="/std/pcr/">05 性病即日検査・PCR検査</option><option value="/std/chlamydia/">06 クラミジア</option><option value="/std/gonorrhea/">07 淋菌（淋病）</option><option value="/std/syphilis/">08 梅毒</option><option value="/std/hiv/">09 HIV</option><option value="/std/candida/">10 カンジダ</option><option value="/std/trichomonas/">11 トリコモナス</option><option value="/std/herpes/">12 性器・口唇ヘルペス</option><option value="/std/mycoplasma/">13 マイコプラズマ尿道炎</option><option value="/std/hepatitis/">14 B型・C型肝炎</option><option value="/jihi/">15 自費診療一覧</option><option value="/beauty/">16 美容点滴・美容内服</option><option value="/aga/">17 AGA治療</option><option value="/ed/">18 ED治療</option><option value="/pill/">19 低用量ピル</option><option value="/afterpill/">20 アフターピル</option><option value="/diet/">21 メディカルダイエット</option><option value="/price/">22 料金表</option><option value="/about/">23 当院について</option><option value="/about/doctor/">24 院長紹介</option><option value="/faq/">25 よくある質問</option><option value="/news/">26 お知らせ一覧</option><option value="/news/sample/">27 お知らせ詳細</option><option value="/en/">28 For Inbound Tourists</option><option value="/manga/">29 マンガでわかる！</option><option value="/privacy/">30 プライバシーポリシー</option></select>
<label><input type="checkbox" id="sync" checked>ページ移動を連動</label>
<label><input type="checkbox" id="ssync">スクロールを連動（おおよそ）</label>
<span class="sp"></span><a href="/choose/">バージョン選択へ</a></div>
<div class="stage">
<div class="pane sp-p"><p>スマホ版（375px） <a id="spo" href="../" target="_blank" rel="noopener">単独で開く ↗</a></p><div class="frame"><iframe id="sp" title="スマホ版"></iframe></div></div>
<div class="pane pc-p"><p><span>PC版（1440px・<span id="sc">100</span>%表示）</span> <a id="pco" href="../pc/" target="_blank" rel="noopener">単独で開く ↗</a></p><div class="frame" id="pcf"><iframe id="pc" title="PC版"></iframe></div></div>
</div>
<script>
(() => {
  const ROOT = location.pathname.replace(/compare\/.*$/, '');  // 例：/v6/
  const sp = document.getElementById('sp'), pc = document.getElementById('pc'), pcf = document.getElementById('pcf');
  const sel = document.getElementById('pg'), sync = document.getElementById('sync'), ssync = document.getElementById('ssync');
  const norm = p => '/' + (p || '').replace(/^\/+/, '').replace(/index\.html$/, '');
  const qp = new URLSearchParams(location.search).get('p');
  let cur = norm(qp || '/');
  const fit = () => { const s = pcf.clientWidth / 1440; pc.style.transform = `scale(${s})`; pc.style.height = (pcf.clientHeight / s) + 'px'; document.getElementById('sc').textContent = Math.round(s * 100); };
  addEventListener('resize', fit); fit();
  const pathOf = f => { try { const p = f.contentWindow.location.pathname; return p.startsWith(ROOT) ? p.slice(ROOT.length - 1) : null; } catch (e) { return null; } };
  const show = (p, from) => {
    cur = norm(p);
    const spU = ROOT + cur.slice(1), pcU = ROOT + 'pc' + cur;
    if (from !== 'sp' && norm(pathOf(sp)) !== cur) sp.src = spU;
    if (from !== 'pc' && norm((pathOf(pc) || '').replace(/^\/pc/, '')) !== cur) pc.src = pcU;
    document.getElementById('spo').href = spU; document.getElementById('pco').href = pcU;
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
    try { history.replaceState(null, '', '?p=' + cur); } catch (e) {}
  };
  sp.addEventListener('load', () => { const p = pathOf(sp); bindScroll(sp, pc); if (p && sync.checked && norm(p) !== cur) show(p, 'sp'); });
  pc.addEventListener('load', () => { const p = pathOf(pc); bindScroll(pc, sp); if (p && sync.checked) { const q = norm(p.replace(/^\/pc/, '')); if (q !== cur) show(q, 'pc'); } });
  sel.addEventListener('change', () => show(sel.value));
  // スクロール連動：ページ全体に対する位置の割合で合わせる（レイアウトが違うのでおおよそ）
  let lock = 0;
  function bindScroll(a, b) { try { const w = a.contentWindow; w.addEventListener('scroll', () => {
    if (!ssync.checked || Date.now() < lock) return; const bw = b.contentWindow, ad = w.document.documentElement, bd = bw.document.documentElement;
    const r = w.scrollY / Math.max(1, ad.scrollHeight - w.innerHeight); lock = Date.now() + 120; bw.scrollTo(0, r * Math.max(0, bd.scrollHeight - bw.innerHeight)); }, {passive: true}); } catch (e) {} }
  show(cur);
})();
</script></body></html>
